name: Bug report
description: Report a reproducible defect in the template or an instantiated project
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the smallest reproducible evidence without secrets or private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include environment, version, and exact steps.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Highest plausible impact
      options:
        - Local and reversible
        - Multi-file or behavioral
        - Security, data, contract, release, or availability
        - Active critical incident
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: Commands, logs with sensitive values removed, or failing fixture references.
