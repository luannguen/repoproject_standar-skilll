name: Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reusable-layer:
    name: Reusable layer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate
        shell: pwsh
        run: ./components/instruction/scripts/validate.ps1
