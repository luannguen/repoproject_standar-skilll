name: Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reusable-layer:
    name: Reusable layer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Validate
        shell: pwsh
        run: ./components/instruction/scripts/validate.ps1
